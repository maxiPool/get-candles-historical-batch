info:
  version: "@project.version@"
  dependencies:
    boot:
      version: "@spring-boot.version@"

spring:
  threads.virtual.enabled: true

  main:
    allow-bean-definition-overriding: false
  application:
    name: @project.artifactId@

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null
    serialization:
      write_dates_as_timestamps: false
      write_dates_with_zone_id: true
      write_bigdecimal_as_plain: true
    deserialization:
      fail_on_unknown_properties: false
      adjust_dates_to_context_time_zone: false
      use_big_decimal_for_floats: true

  mail:
    host: smtp.gmail.com
    port: 587
    protocol: smtp
    properties.mail.smtp:
      auth: true
      starttls.enable: true
      connectiontimeout: 5000
      timeout: 5000
      writetimeout: 5000

infra:
  oanda:
    v20:
      # Retired as output on 2026-11-02 (it ran in an empty ~/Documents since 12 Aug). The local profile may still
      # override `base`; the candle paths below no longer depend on it.
      base: "/home/max/Documents"
      # master data folder (owner ruling 2026-11-02)
      data-root: "/home/max/data/documents"
      devStreamUrl: "https://stream-fxpractice.oanda.com"
      prodStreamUrl: "https://stream-fxtrade.oanda.com"
      devRestUrl: "https://api-fxpractice.oanda.com"
      prodRestUrl: "https://api-fxtrade.oanda.com"
      isProduction: false
      candlestick:
        enabled: true
        # linux path
        outputPath: "${infra.oanda.v20.data-root}/all_candles/candles-monthly"
        copyOutputPath: "${infra.oanda.v20.data-root}/all_candles_copy/candles-monthly"

app:
  disableOnDays:
    - SATURDAY
    - SUNDAY
  # stale-jar check: the jar's build commit (set by bin/deploy.sh via -Dgit.commit) must match src/ and pom.xml at HEAD
  repo-dir: "/home/max/dev/projects/get-candles-historical-batch"
  build-commit: "@git.commit@"
  stale-jar-check: true
  stale-after-trading-hours: 24
  max-pairs-without-file: 4
  dry-run: false
  # read by bin/freshness-check.py; relative to the working directory (the cron script cds into repo-dir)
  success-marker-path: "last-success.txt"
